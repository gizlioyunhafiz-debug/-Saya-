<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Λύκειο Countdown 🇬🇷</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0b0d12;color:white;font-family:Arial,sans-serif}.card{width:min(760px,100%);text-align:center;padding:35px 20px;border-radius:28px;background:#171b24;border:1px solid #303746}.flag{font-size:55px}.school{font-size:14px;letter-spacing:4px;opacity:.55;margin:8px 0 14px}h1{font-size:clamp(30px,7vw,54px);margin:0 0 12px}.subtitle{opacity:.7;margin-bottom:28px}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{padding:18px 5px;border-radius:18px;background:#0d1119}.num{font-size:clamp(34px,9vw,62px);font-weight:800}.label{font-size:11px;opacity:.5;margin-top:7px}.date{margin-top:25px;font-size:13px;opacity:.45}@media(max-width:500px){.box{padding:15px 2px}.label{font-size:9px}}
</style>
</head>
<body>
<main class="card">
<div class="flag">🇬🇷</div>
<div class="school">ΛΥΚΕΙΟ</div>
<h1>Μέχρι να κλείσουν τα σχολεία</h1>
<div class="subtitle">Αντίστροφη μέτρηση</div>
<div class="countdown">
<div class="box"><div class="num" id="days">--</div><div class="label">ΗΜΕΡΕΣ</div></div>
<div class="box"><div class="num" id="hours">--</div><div class="label">ΩΡΕΣ</div></div>
<div class="box"><div class="num" id="minutes">--</div><div class="label">ΛΕΠΤΑ</div></div>
<div class="box"><div class="num" id="seconds">--</div><div class="label">ΔΕΥΤΕΡΟΛΕΠΤΑ</div></div>
</div>
<div class="date">Στόχος: 15 Μαΐου 2027, 00:00</div>
</main>
<script>
const target=new Date("2027-05-15T00:00:00");
function tick(){
 let d=Math.max(0,target-Date.now()),s=Math.floor(d/1000);
 document.getElementById("days").textContent=Math.floor(s/86400);
 document.getElementById("hours").textContent=String(Math.floor(s%86400/3600)).padStart(2,"0");
 document.getElementById("minutes").textContent=String(Math.floor(s%3600/60)).padStart(2,"0");
 document.getElementById("seconds").textContent=String(s%60).padStart(2,"0");
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
